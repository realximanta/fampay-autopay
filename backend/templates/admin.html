<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Admin | Auto-Pay</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Tailwind CSS via CDN -->
	<script src="https://cdn.tailwindcss.com"></script>
	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
	<!-- Lucide Icons -->
	<script src="https://unpkg.com/lucide@latest"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
					colors: {
						brand: { bg: '#000000', surface: '#0a0a0a', border: '#222222', text: '#ededed', muted: '#888888', accent: '#ffffff' }
					}
				}
			}
		}
	</script>
</head>
<body class="bg-brand-bg text-brand-text font-sans antialiased min-h-screen">
	<!-- Navbar -->
	<nav class="border-b border-brand-border bg-brand-surface px-6 py-4 flex justify-between items-center">
		<div class="flex items-center gap-2">
			<i data-lucide="shield" class="w-6 h-6 text-brand-accent"></i>
			<span class="font-bold text-lg tracking-tight">Admin Console</span>
		</div>
		<div class="flex items-center gap-4 text-sm">
			<button onclick="loadUsers()" class="text-brand-muted hover:text-white transition flex items-center gap-1"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh</button>
			<a href="/api/admin/logout" class="text-red-400 hover:text-red-300 transition">Logout</a>
		</div>
	</nav>

	<main class="container mx-auto px-6 py-10">
		<!-- Login View -->
		<div id="loginView" class="max-w-md mx-auto bg-brand-surface border border-brand-border rounded-xl p-8 mt-20 text-center">
			<i data-lucide="lock" class="w-12 h-12 text-brand-muted mx-auto mb-4"></i>
			<h1 class="text-2xl font-bold mb-6">Admin Login</h1>
			<input type="password" id="adminPass" placeholder="Enter Password" class="w-full bg-black border border-brand-border rounded-lg px-4 py-3 text-white mb-4 focus:outline-none focus:border-gray-500 transition">
			<button onclick="login()" class="w-full bg-brand-accent text-black py-3 rounded-lg font-semibold hover:bg-gray-200 transition">Login</button>
			<p id="loginError" class="text-red-500 text-sm mt-4 hidden">Invalid password</p>
		</div>

		<!-- Panel View -->
		<div id="panelView" class="hidden">
			<div class="mb-6">
				<h1 class="text-2xl font-bold">User Management</h1>
				<p class="text-brand-muted text-sm mt-1">Manage keys, expiry, and user access.</p>
			</div>
			
			<div class="bg-brand-surface border border-brand-border rounded-xl overflow-hidden">
				<div class="overflow-x-auto">
					<table class="w-full text-left border-collapse">
						<thead>
							<tr class="border-b border-brand-border bg-black">
								<th class="py-3 px-4 text-xs font-semibold text-brand-muted uppercase tracking-wider">Email</th>
								<th class="py-3 px-4 text-xs font-semibold text-brand-muted uppercase tracking-wider">API Key</th>
								<th class="py-3 px-4 text-xs font-semibold text-brand-muted uppercase tracking-wider">Days Left</th>
								<th class="py-3 px-4 text-xs font-semibold text-brand-muted uppercase tracking-wider text-right">Actions</th>
							</tr>
						</thead>
						<tbody id="userTable" class="divide-y divide-brand-border">
							<!-- Rows injected by JS -->
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>

	<script>
		lucide.createIcons();

		async function login() {
			const pass = document.getElementById('adminPass').value;
			const res = await fetch('/api/admin/login', { method: 'POST', body: JSON.stringify({password: pass}) });
			if (res.ok) {
				document.getElementById('loginView').classList.add('hidden');
				document.getElementById('panelView').classList.remove('hidden');
				loadUsers();
			} else {
				document.getElementById('loginError').classList.remove('hidden');
			}
		}

		async function loadUsers() {
			const res = await fetch('/api/admin/users', { cache: 'no-store' });
			if (!res.ok) return window.location.reload();
			const users = await res.json();
			
			const tbody = document.getElementById('userTable');
			tbody.innerHTML = '';
			
			users.forEach(u => {
				const tr = document.createElement('tr');
				tr.className = "hover:bg-white/5 transition";
				tr.innerHTML = `
					<td class="py-3 px-4 font-medium">${u.email}</td>
					<td class="py-3 px-4 font-mono text-sm text-yellow-400">
						<div class="flex items-center gap-2">
							${u.api_key || 'NO KEY'} 
							<button onclick="copyKey('${u.api_key}')" class="text-brand-muted hover:text-white"><i data-lucide="copy" class="w-3 h-3"></i></button>
						</div>
					</td>
					<td class="py-3 px-4">
						<span class="px-2 py-1 rounded text-xs ${u.days_left > 0 ? 'bg-green-900/30 text-green-400' : 'bg-red-900/30 text-red-400'}">${u.days_left}</span>
					</td>
					<td class="py-3 px-4 text-right">
						<div class="flex items-center justify-end gap-2">
							<button onclick="updateExp('${u.email}', 14)" class="px-2 py-1 text-xs bg-white/10 hover:bg-white/20 rounded transition">+14d</button>
							<button onclick="updateExp('${u.email}', 30)" class="px-2 py-1 text-xs bg-white/10 hover:bg-white/20 rounded transition">+30d</button>
							<button onclick="updateExp('${u.email}', -1)" class="px-2 py-1 text-xs bg-red-900/30 text-red-400 hover:bg-red-900/50 rounded transition">-1d</button>
							<button onclick="revokeKey('${u.email}')" class="px-2 py-1 text-xs border border-red-900/50 text-red-400 hover:bg-red-900/20 rounded transition">Revoke</button>
						</div>
					</td>
				`;
				tbody.appendChild(tr);
			});
			lucide.createIcons(); // Re-init icons for dynamic content
		}

		function copyKey(key) {
			navigator.clipboard.writeText(key);
			alert('Key copied!');
		}

		async function updateExp(email, days) {
			if(!confirm("Update " + email + " by " + days + " days?")) return;
			await fetch('/api/admin/expiry', { method: 'POST', body: JSON.stringify({email: email, days: days}) });
			loadUsers();
		}

		async function revokeKey(email) {
			if(!confirm("Revoke key for " + email + "? They will need a new key.")) return;
			await fetch('/api/admin/revoke?email=' + encodeURIComponent(email), { method: 'POST' });
			loadUsers();
		}
	</script>
</body>
</html>
