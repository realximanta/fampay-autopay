name: Generate Keystore (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + secrets file
        run: |
          set -euo pipefail
          mkdir -p out
          PASSWORD=$(openssl rand -hex 24)
          ALIAS="autopay"
          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=AutoPay, OU=App, O=Ximanta, L=NA, ST=NA, C=IN"
          test -s out/release.keystore
          BASE64=$(base64 -w0 out/release.keystore)
          {
            printf 'KEYSTORE_BASE64=%s\n' "$BASE64"
            printf 'KEYSTORE_PASSWORD=%s\n' "$PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$PASSWORD"
          } > out/keystore-secrets.txt
          chmod 600 out/keystore-secrets.txt
          echo "wrote $(wc -c < out/keystore-secrets.txt) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopay-keystore-secrets
          path: out/keystore-secrets.txt
          retention-days: 1
          if-no-files-found: error
