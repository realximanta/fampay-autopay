name: Build and Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag format and extract version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read current version from build.gradle.kts
        id: current
        run: |
          GRADLE="app/build.gradle.kts"
          [ -f "$GRADLE" ] || { echo "::error::$GRADLE missing"; exit 1; }
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE" | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE" | head -1)
          [ -n "$CODE" ] || { echo "::error::versionCode not found"; exit 1; }
          [ -n "$NAME" ] || { echo "::error::versionName not found"; exit 1; }
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          if [ "$NAME" = "${{ steps.ver.outputs.version }}" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "versionName already at $NAME — idempotent re-run, skipping bump"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and commit
        if: steps.current.outputs.skip == 'false'
        id: bump
        run: |
          GRADLE="app/build.gradle.kts"
          NEW_CODE=$(( ${{ steps.current.outputs.code }} + 1 ))
          sed -i "s/versionCode = ${{ steps.current.outputs.code }}/versionCode = $NEW_CODE/" "$GRADLE"
          sed -i 's/versionName = "${{ steps.current.outputs.name }}"/versionName = "${{ steps.ver.outputs.version }}"/' "$GRADLE"
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE"
          git commit -m "chore(release): bump to v${{ steps.ver.outputs.version }} (build $NEW_CODE)"
          git push origin HEAD:main

      - name: Resolve final versionCode
        id: final
        run: |
          if [ -n "${{ steps.bump.outputs.new_code }}" ]; then
            echo "code=${{ steps.bump.outputs.new_code }}" >> $GITHUB_OUTPUT
          else
            echo "code=${{ steps.current.outputs.code }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/release.keystore"
          chmod 600 "$HOME/.android/release.keystore"
          test -s "$HOME/.android/release.keystore" || { echo "::error::keystore decoded to empty file"; exit 1; }

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_PATH="$HOME/.android/release.keystore"
          API_URL="${{ secrets.AUTOPAY_API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::warning::AUTOPAY_API_BASE_URL secret not set, using fallback"
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon -PAUTOPAY_API_BASE_URL="$API_URL"
          else
            gradle :app:assembleRelease --no-daemon -PAUTOPAY_API_BASE_URL="$API_URL"
          fi

      - name: Locate and rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          [ -n "$SRC" ] || { echo "::error::no APK produced"; exit 1; }
          DEST="autopay-${{ steps.ver.outputs.tag }}.apk"
          cp "$SRC" "$DEST"
          SIZE=$(stat -c%s "$DEST")
          echo "path=$DEST"   >> $GITHUB_OUTPUT
          echo "size=$SIZE"   >> $GITHUB_OUTPUT

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ steps.ver.outputs.tag }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Write latest.json
        run: |
          mkdir -p data
          cat > data/latest.json <<EOF
          {
            "tag": "${{ steps.ver.outputs.tag }}",
            "version": "${{ steps.ver.outputs.version }}",
            "versionCode": ${{ steps.final.outputs.code }},
            "apk_url": "https://github.com/realximanta/fampay-autopay/releases/download/${{ steps.ver.outputs.tag }}/${{ steps.apk.outputs.path }}",
            "apk_size": ${{ steps.apk.outputs.size }},
            "release_url": "https://github.com/realximanta/fampay-autopay/releases/tag/${{ steps.ver.outputs.tag }}",
            "published_at": "${{ github.event.release.published_at }}"
          }
          EOF
          cat data/latest.json

      - name: Commit latest.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "no changes to latest.json"
            exit 0
          fi
          git commit -m "chore(release): update latest.json for ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
